name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract NEWS section for tag
        id: news
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          tag = os.environ["TAG_NAME"]
          # Tags follow the v<version> convention (e.g. v0.4.0).
          version = tag.lstrip("v")

          news = pathlib.Path("NEWS").read_text(encoding="utf-8").splitlines()
          # NEWS sections look like:
          #   0.3.1 (2026-05-17)
          #   =====
          #   - item
          #   ...
          # Stop at the next version header.
          header_re = re.compile(r"^\d+\.\d+\.\d+[A-Za-z0-9.\-+]*\s+\(\d{4}-\d{2}-\d{2}\)\s*$")

          start = None
          for i, line in enumerate(news):
              if line.strip().startswith(version + " ("):
                  start = i
                  break
          if start is None:
              sys.exit(f"release.yml: NEWS has no section for version {version}")

          # Collect this section's body (skip the header and the '=====' rule).
          body_lines = []
          i = start + 1
          if i < len(news) and set(news[i].strip()) == {"="}:
              i += 1
          while i < len(news) and not header_re.match(news[i].strip()):
              body_lines.append(news[i])
              i += 1

          body = "\n".join(body_lines).strip()
          if not body:
              sys.exit(f"release.yml: NEWS section for {version} is empty")

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("body<<EOF\n")
              fh.write(body)
              fh.write("\nEOF\n")
              fh.write(f"version={version}\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "MeowMenu ${{ steps.news.outputs.version }}" \
            --notes "${{ steps.news.outputs.body }}"
