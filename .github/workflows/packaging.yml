name: packaging

on:
  push:
    tags:
      - 'v*-rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release-candidate tag
        required: true
        type: string
      publish:
        description: Publish the verified draft prerelease
        required: true
        default: false
        type: boolean
      authorization:
        description: Enter "publish <tag>" after completing live checks
        required: false
        type: string
      manual_evidence:
        description: Durable URL for the primary fresh-install and upgrade results
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      debian_version: ${{ steps.identity.outputs.debian_version }}
      rpm_version: ${{ steps.identity.outputs.rpm_version }}
      arch_version: ${{ steps.identity.outputs.arch_version }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate annotated tag, main ancestry, and NEWS identity
        id: identity
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag || {
            echo "::error::${RELEASE_TAG} must be an annotated tag"
            exit 1
          }
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "::error::${RELEASE_TAG} is not reachable from main"
            exit 1
          }
          version="$(python3 build-aux/news-version.py --version --news NEWS)"
          expected_tag="$(python3 build-aux/news-version.py --tag --news NEWS)"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "::error::Tag ${RELEASE_TAG} does not match top NEWS version ${version}"
            exit 1
          }
          python3 build-aux/news-version.py --date --news NEWS
          {
            echo "version=${version}"
            echo "debian_version=$(python3 build-aux/news-version.py --debian-version --news NEWS)"
            echo "rpm_version=$(python3 build-aux/news-version.py --rpm-version --news NEWS)"
            echo "arch_version=$(python3 build-aux/news-version.py --arch-version --news NEWS)"
          } >> "$GITHUB_OUTPUT"

  source:
    name: canonical-source
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create canonical source archive
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p artifacts
          python3 build-aux/release/artifacts.py create-source \
            --repository . \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --output "artifacts/xfce4-meowmenu-plugin-${VERSION}.tar.gz"

      - name: Upload canonical source
        uses: actions/upload-artifact@v7
        with:
          name: canonical-source
          path: artifacts/*.tar.gz

  build-deb:
    name: build-deb (${{ matrix.label }})
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-26.04
            image: ubuntu:26.04
            token: ubuntu26.04
            artifact: deb-package-ubuntu
          - label: debian-13
            image: debian:13
            token: debian13
            artifact: deb-package-debian
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian package bootstrap tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper devscripts dpkg-dev \
            equivs python3

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Build, test, validate, and install package
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        run: |
          set -euo pipefail
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cd "xfce4-meowmenu-plugin-${VERSION}"
          if dpkg-query -W libexo-2-dev >/dev/null 2>&1; then
            echo "::error::libexo-2-dev was installed before manifest resolution"
            exit 1
          fi
          date_rfc="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          {
            echo "xfce4-meowmenu-plugin (${DEBIAN_VERSION}) unstable; urgency=medium"
            echo
            echo "  * MeowMenu ${VERSION}."
            echo
            echo " -- Matteo Bonanomi <mbonanomi.dev@proton.me>  ${date_rfc}"
          } > debian/changelog
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-checkbuilddeps
          dpkg-buildpackage -us -uc -b
          package="$(find .. -maxdepth 1 -name 'xfce4-meowmenu-plugin_*_amd64.deb' -print -quit)"
          test "$(dpkg-deb -f "$package" Version)" = "$DEBIAN_VERSION"
          dpkg --compare-versions 0.8.0-1 lt "$DEBIAN_VERSION"
          dpkg --compare-versions "$DEBIAN_VERSION" lt 0.9.0~rc2-1
          dpkg --compare-versions "$DEBIAN_VERSION" lt 0.9.0-1
          apt-get install -y --no-install-recommends appstream lintian
          appstreamcli validate --no-net \
            data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml
          lintian "$package" | tee ../lintian.log || true
          apt-get install -y "$package"
          test "$(dpkg-query -W -f='${Version}' xfce4-meowmenu-plugin)" = "$DEBIAN_VERSION"
          dpkg-query -W -f='${Depends}\n' xfce4-meowmenu-plugin | \
            tr ',' '\n' | grep -Eq '^[[:space:]]*exo-utils([[:space:]]|$)'
          test "$(dpkg-query -S /usr/bin/exo-open | cut -d: -f1)" = exo-utils
          test "$(dpkg-query -S /usr/bin/exo-desktop-item-edit | cut -d: -f1)" = exo-utils
          plugin="$(find /usr/lib -path '*/xfce4/panel/plugins/libmeowmenu.so' -print -quit)"
          build-aux/compat/assert-dependency-regime.sh \
            --regime legacy --plugin "$plugin" \
            --testlog "$(find . -path '*/meson-logs/testlog.txt' -print -quit)"
          build-aux/compat/installed-action-smoke.sh \
            --regime legacy --plugin "$plugin" > ../installed-action-smoke.log
          mkdir -p ../artifacts
          cp "$package" \
            "../artifacts/xfce4-meowmenu-plugin_${VERSION}_${{ matrix.token }}_amd64.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.deb

      - name: Upload advisory lint output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lintian-${{ matrix.token }}
          path: lintian.log
          if-no-files-found: ignore
          retention-days: 7

  debian-exo-negative:
    name: debian-exo-negative (${{ matrix.label }}, ${{ matrix.omission }})
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-26.04
            image: ubuntu:26.04
            omission: libexo-2-dev
          - label: ubuntu-26.04
            image: ubuntu:26.04
            omission: exo-utils
          - label: debian-13
            image: debian:13
            omission: libexo-2-dev
          - label: debian-13
            image: debian:13
            omission: exo-utils
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install mutation bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Require the direct-contract mutation to fail closed
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          OMISSION: ${{ matrix.omission }}
        run: |
          set -euo pipefail
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cd "xfce4-meowmenu-plugin-${VERSION}"
          sed -i "/^[[:space:]]${OMISSION},$/d" debian/control
          if python3 tests/test_dependency_contract.py; then
            echo "::error::direct contract accepted missing ${OMISSION}"
            exit 1
          fi
          printf 'target=%s\nomission=%s\nresult=rejected\n' \
            '${{ matrix.label }}' "$OMISSION" >> "$GITHUB_STEP_SUMMARY"

  build-rpm:
    name: build-rpm (fedora-44)
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install RPM package bootstrap tools
        run: |
          dnf -y install \
            dnf-plugins-core rpm-build rpmdevtools python3 ca-certificates

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Build, test, validate, and install package
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          RPM_VERSION: ${{ needs.validate-tag.outputs.rpm_version }}
        run: |
          set -euo pipefail
          rpmdev-setuptree
          cp "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz" "$HOME/rpmbuild/SOURCES/"
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cp "xfce4-meowmenu-plugin-${VERSION}/dist/rpm/xfce4-meowmenu-plugin.spec" \
            "$HOME/rpmbuild/SPECS/"
          spec="$HOME/rpmbuild/SPECS/xfce4-meowmenu-plugin.spec"
          sed -i "s/^Version:.*/Version:        ${RPM_VERSION}/" "$spec"
          sed -i "s/^%global upstream_version.*/%global upstream_version ${VERSION}/" "$spec"
          if rpm -q --whatprovides 'pkgconfig(exo-2)' >/dev/null 2>&1; then
            echo "::error::Exo development files existed before manifest resolution"
            exit 1
          fi
          dnf -y builddep "$spec"
          rpmbuild -ba "$spec"
          package="$(find "$HOME/rpmbuild/RPMS/x86_64" -name 'xfce4-meowmenu-plugin-*.rpm' -print -quit)"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$package")" = "${RPM_VERSION}-1.fc44"
          rpm --eval "%{lua:
            rpm.vercmp('0.8.0', '${RPM_VERSION}') < 0 or error('RC must follow 0.8.0')
            rpm.vercmp('${RPM_VERSION}', '0.9.0~rc2') < 0 or error('RC1 must precede RC2')
            rpm.vercmp('${RPM_VERSION}', '0.9.0') < 0 or error('RC must precede final')
          }"
          dnf -y install appstream rpmlint
          appstreamcli validate --no-net \
            "xfce4-meowmenu-plugin-${VERSION}/data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml"
          rpmlint "$spec" "$package" | tee rpmlint.log || true
          dnf -y install "$package"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' xfce4-meowmenu-plugin)" = \
            "${RPM_VERSION}-1.fc44"
          test "$(rpm -qf /usr/bin/exo-open)" = exo
          test "$(rpm -qf /usr/bin/exo-desktop-item-edit)" = exo
          plugin="$(find /usr/lib64 /usr/lib -path '*/xfce4/panel/plugins/libmeowmenu.so' -print -quit)"
          testlog="$(find "$HOME/rpmbuild/BUILD" -path '*/meson-logs/testlog.txt' -print -quit)"
          "xfce4-meowmenu-plugin-${VERSION}/build-aux/compat/assert-dependency-regime.sh" \
            --regime legacy --plugin "$plugin" \
            --testlog "$testlog"
          "xfce4-meowmenu-plugin-${VERSION}/build-aux/compat/installed-action-smoke.sh" \
            --regime legacy --plugin "$plugin" > installed-action-smoke.log
          mkdir -p artifacts
          cp "$package" \
            "artifacts/xfce4-meowmenu-plugin-${VERSION}-1.fc44.x86_64.rpm"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: artifacts/*.rpm

      - name: Upload advisory lint output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpmlint-fedora44
          path: rpmlint.log
          if-no-files-found: ignore
          retention-days: 7

  fedora-exo-negative:
    name: fedora-exo-negative (${{ matrix.omission }})
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        omission: [build, helper]
    container:
      image: fedora:44
    steps:
      - name: Install mutation bootstrap tools
        run: dnf -y install python3

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Require the Fedora direct-contract mutation to fail closed
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          OMISSION: ${{ matrix.omission }}
        run: |
          set -euo pipefail
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cd "xfce4-meowmenu-plugin-${VERSION}"
          if test "$OMISSION" = build; then
            sed -i '/^BuildRequires:[[:space:]]*pkgconfig(exo-2)$/d' \
              dist/rpm/xfce4-meowmenu-plugin.spec
          else
            sed -i '\|^Requires:[[:space:]]*/usr/bin/exo-open$|d' \
              dist/rpm/xfce4-meowmenu-plugin.spec
          fi
          if python3 tests/test_dependency_contract.py; then
            echo "::error::Fedora direct contract accepted ${OMISSION} omission"
            exit 1
          fi
          printf 'target=fedora-44\nomission=%s\nresult=rejected\n' \
            "$OMISSION" >> "$GITHUB_STEP_SUMMARY"

  arch-pkgbuild-test:
    name: arch-pkgbuild-test
    needs: validate-tag
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install packaging tools and create builder
        run: |
          pacman -Syu --noconfirm --needed git namcap pacman-contrib sudo
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Prepare, build, test, lint, install, and compare version
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          EXPECTED_ARCH_VERSION: ${{ needs.validate-tag.outputs.arch_version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build_dir="$(build-aux/arch/prepare-source.sh)"
          package="$(build-aux/arch/build-package.sh "$build_dir")"
          build-aux/arch/run-namcap.sh \
            "$build_dir/PKGBUILD" "$package" "$RUNNER_TEMP/arch-logs"
          build-aux/arch/smoke-install.sh "$package"
          test "$(pacman -Q xfce4-meowmenu-plugin | awk '{print $2}')" = \
            "${EXPECTED_ARCH_VERSION}-1"
          test "$(vercmp 0.8.0 "$EXPECTED_ARCH_VERSION")" -lt 0
          test "$(vercmp "$EXPECTED_ARCH_VERSION" 0.9.0rc2)" -lt 0
          test "$(vercmp "$EXPECTED_ARCH_VERSION" 1.0.0)" -lt 0
          cp "$build_dir/PKGBUILD" "$RUNNER_TEMP/arch-logs/PKGBUILD"
          sudo -u builder bash -c \
            "cd '$build_dir' && makepkg --printsrcinfo" \
            > "$RUNNER_TEMP/arch-logs/.SRCINFO"

      - name: Upload Arch validation metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-pkgbuild-logs
          path: ${{ runner.temp }}/arch-logs
          if-no-files-found: error
          retention-days: 30

  arch-exo-negative:
    name: arch-exo-negative
    needs: validate-tag
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install mutation tools
        run: pacman -Syu --noconfirm --needed git python

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require the Arch direct-contract mutation to fail closed
        run: |
          set -euo pipefail
          sed -i "s/'exo' //" dist/arch/PKGBUILD
          if python3 tests/test_dependency_contract.py; then
            echo "::error::Arch direct contract accepted missing exo"
            exit 1
          fi
          printf 'target=arch-current\nomission=exo\nresult=rejected\n' \
            >> "$GITHUB_STEP_SUMMARY"

  assemble-release:
    name: assemble-private-prerelease
    needs: [validate-tag, source, build-deb, debian-exo-negative, build-rpm, fedora-exo-negative, arch-pkgbuild-test, arch-exo-negative]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Run release, presentation, documentation, and translation gates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext appstream
          python3 tests/test_release_version.py
          python3 tests/test_release_contract.py
          python3 tests/test_repository_presentation.py
          python3 tests/test_documentation_links.py
          python3 tests/test_translation_status.py
          appstreamcli validate --no-net \
            data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml

      - name: Download Ubuntu DEB
        uses: actions/download-artifact@v8
        with:
          name: deb-package-ubuntu
          path: artifacts

      - name: Download Debian DEB
        uses: actions/download-artifact@v8
        with:
          name: deb-package-debian
          path: artifacts

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: artifacts

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: artifacts

      - name: Generate and validate notes, manifest, and inventory
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python3 build-aux/release/release_notes.py \
            --news NEWS --version "$VERSION" --output release-notes.md
          python3 build-aux/release/artifacts.py checksums \
            --assets artifacts --version "$VERSION"
          python3 build-aux/release/artifacts.py verify \
            --assets artifacts --version "$VERSION"

      - name: Create or replace one private draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = true || {
              echo "::error::A public release already exists for ${RELEASE_TAG}"
              exit 1
            }
            gh release delete-asset "$RELEASE_TAG" --yes \
              "xfce4-meowmenu-plugin_${VERSION}_ubuntu26.04_amd64.deb" || true
            gh release delete-asset "$RELEASE_TAG" --yes \
              "xfce4-meowmenu-plugin_${VERSION}_debian13_amd64.deb" || true
            gh release delete-asset "$RELEASE_TAG" --yes \
              "xfce4-meowmenu-plugin-${VERSION}-1.fc44.x86_64.rpm" || true
            gh release delete-asset "$RELEASE_TAG" --yes \
              "xfce4-meowmenu-plugin-${VERSION}.tar.gz" || true
            gh release delete-asset "$RELEASE_TAG" --yes SHA256SUMS || true
            gh release edit "$RELEASE_TAG" \
              --title "MeowMenu ${VERSION}" --notes-file release-notes.md \
              --draft --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --title "MeowMenu ${VERSION}" \
              --notes-file release-notes.md --draft --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber

      - name: Download and verify the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir downloaded
          gh release download "$RELEASE_TAG" --dir downloaded
          python3 build-aux/release/artifacts.py verify \
            --assets downloaded --version "$VERSION"

      - name: Publish only with explicit live-evidence authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          AUTHORIZATION: ${{ inputs.authorization }}
          MANUAL_EVIDENCE: ${{ inputs.manual_evidence }}
        run: |
          test "$AUTHORIZATION" = "publish ${RELEASE_TAG}" || {
            echo "::error::Authorization must be exactly: publish ${RELEASE_TAG}"
            exit 1
          }
          test -n "$MANUAL_EVIDENCE" || {
            echo "::error::A durable primary live-test evidence URL is required"
            exit 1
          }
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
