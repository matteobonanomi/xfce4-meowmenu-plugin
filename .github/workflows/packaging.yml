name: packaging

on:
  push:
    branches:
      - development
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Build development artifacts or recover an existing release
        required: true
        default: artifact-only
        type: choice
        options:
          - artifact-only
          - recover-release
      tag:
        description: Existing annotated or lightweight tag (recover-release only)
        required: false
        default: ''
        type: string

concurrency:
  group: packaging-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RECOVERY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
  CANDIDATE_REF: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'artifact-only')) && github.sha || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
  ARTIFACT_ONLY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'artifact-only') }}

jobs:
  validate-tag:
    name: validate-candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      debian_version: ${{ steps.identity.outputs.debian_version }}
      rpm_version: ${{ steps.identity.outputs.rpm_version }}
      arch_version: ${{ steps.identity.outputs.arch_version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: release-tools

      - name: Authorize existing-tag recovery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover-release'
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_REF" in
            */.github/workflows/packaging.yml@refs/heads/main) ;;
            *)
              echo "::error::Existing-tag recovery must use the workflow from main"
              exit 1
              ;;
          esac
          git -C release-tools fetch --force \
            origin main:refs/remotes/origin/main
          test "$(git -C release-tools rev-parse HEAD)" = "$WORKFLOW_SHA"
          git -C release-tools merge-base --is-ancestor \
            "$WORKFLOW_SHA" origin/main || {
            echo "::error::Recovery workflow revision is not reachable from main"
            exit 1
          }

      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          path: candidate

      - name: Validate candidate identity
        id: identity
        run: |
          set -euo pipefail
          version="$(python3 release-tools/build-aux/news-version.py \
            --version --news candidate/NEWS)"
          expected_tag="$(python3 release-tools/build-aux/news-version.py \
            --tag --news candidate/NEWS)"
          python3 release-tools/build-aux/news-version.py \
            --date --news candidate/NEWS
          commit="$(git -C candidate rev-parse HEAD)"
          if [[ "$ARTIFACT_ONLY" == true ]]; then
            test "$GITHUB_REF" = refs/heads/development || {
              echo "::error::Artifact-only packaging must run from development"
              exit 1
            }
            test -z "$RECOVERY_TAG" || {
              echo "::error::Artifact-only packaging does not accept a release tag"
              exit 1
            }
            test "$commit" = "$GITHUB_SHA" || {
              echo "::error::Candidate checkout does not match the selected development commit"
              exit 1
            }
            publish=false
          else
            git -C candidate fetch --force origin main:refs/remotes/origin/main
            commit="$(git -C candidate rev-parse "${RELEASE_TAG}^{commit}")"
            git -C candidate merge-base --is-ancestor "$commit" origin/main || {
              echo "::error::${RELEASE_TAG} is not reachable from main"
              exit 1
            }
            test "$RELEASE_TAG" = "$expected_tag" || {
              echo "::error::Tag ${RELEASE_TAG} does not match top NEWS version ${version}"
              exit 1
            }
            publish=true
          fi
          {
            echo "version=${version}"
            echo "debian_version=$(python3 release-tools/build-aux/news-version.py --debian-version --news candidate/NEWS)"
            echo "rpm_version=$(python3 release-tools/build-aux/news-version.py --rpm-version --news candidate/NEWS)"
            echo "arch_version=$(python3 release-tools/build-aux/news-version.py --arch-version --news candidate/NEWS)"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

  source:
    name: canonical-source
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          path: candidate

      - name: Create canonical source archive
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p artifacts
          source_identity=(--tag "$RELEASE_TAG")
          if [[ "$ARTIFACT_ONLY" == true ]]; then
            source_identity=(--ref "$CANDIDATE_REF")
          fi
          python3 release-tools/build-aux/release/artifacts.py create-source \
            --repository candidate \
            "${source_identity[@]}" \
            --version "$VERSION" \
            --output "artifacts/xfce4-meowmenu-plugin-${VERSION}.tar.gz"

      - name: Upload canonical source
        uses: actions/upload-artifact@v7
        with:
          name: canonical-source
          path: artifacts/*.tar.gz

  build-deb:
    name: build-deb (${{ matrix.label }})
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-26.04
            image: ubuntu:26.04
            token: ubuntu26.04
            artifact: deb-package-ubuntu
          - label: debian-13
            image: debian:13
            token: debian13
            artifact: deb-package-debian
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian package bootstrap tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper devscripts dpkg-dev \
            equivs python3

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Build, test, validate, and install package
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DEBIAN_VERSION: ${{ needs.validate-tag.outputs.debian_version }}
        run: |
          set -euo pipefail
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cd "xfce4-meowmenu-plugin-${VERSION}"
          if dpkg-query -W libexo-2-dev >/dev/null 2>&1; then
            echo "::error::libexo-2-dev was installed before manifest resolution"
            exit 1
          fi
          date_rfc="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          {
            echo "xfce4-meowmenu-plugin (${DEBIAN_VERSION}) unstable; urgency=medium"
            echo
            echo "  * MeowMenu ${VERSION}."
            echo
            echo " -- Matteo Bonanomi <mbonanomi.dev@proton.me>  ${date_rfc}"
          } > debian/changelog
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control
          dpkg-checkbuilddeps
          dpkg-buildpackage -us -uc -b
          package="$(find .. -maxdepth 1 -name 'xfce4-meowmenu-plugin_*_amd64.deb' -print -quit)"
          test "$(dpkg-deb -f "$package" Version)" = "$DEBIAN_VERSION"
          if [[ "$DEBIAN_VERSION" == *"~rc"* ]]; then
            stable_debian="${DEBIAN_VERSION%%~rc*}-1"
            dpkg --compare-versions "$DEBIAN_VERSION" lt "$stable_debian"
          fi
          apt-get install -y --no-install-recommends appstream lintian
          appstreamcli validate --no-net \
            data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml
          lintian "$package" | tee ../lintian.log || true
          apt-get install -y "$package"
          test "$(dpkg-query -W -f='${Version}' xfce4-meowmenu-plugin)" = "$DEBIAN_VERSION"
          dpkg-query -W -f='${Depends}\n' xfce4-meowmenu-plugin | \
            tr ',' '\n' | grep -Eq '^[[:space:]]*exo-utils([[:space:]]|$)'
          test "$(dpkg-query -S /usr/bin/exo-open | cut -d: -f1)" = exo-utils
          test "$(dpkg-query -S /usr/bin/exo-desktop-item-edit | cut -d: -f1)" = exo-utils
          plugin="$(find /usr/lib -path '*/xfce4/panel/plugins/libmeowmenu.so' -print -quit)"
          build-aux/compat/assert-dependency-regime.sh \
            --regime legacy --plugin "$plugin" \
            --testlog "$(find . -path '*/meson-logs/testlog.txt' -print -quit)"
          build-aux/compat/installed-action-smoke.sh \
            --regime legacy --plugin "$plugin" > ../installed-action-smoke.log
          mkdir -p ../artifacts
          cp "$package" \
            "../artifacts/xfce4-meowmenu-plugin_${VERSION}_${{ matrix.token }}_amd64.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.deb

      - name: Upload advisory lint output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lintian-${{ matrix.token }}
          path: lintian.log
          if-no-files-found: ignore
          retention-days: 7

  build-rpm:
    name: build-rpm (fedora-44)
    needs: [validate-tag, source]
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install RPM package bootstrap tools
        run: |
          dnf -y install \
            dnf-plugins-core rpm-build rpmdevtools python3 ca-certificates

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: source

      - name: Build, test, validate, and install package
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          RPM_VERSION: ${{ needs.validate-tag.outputs.rpm_version }}
        run: |
          set -euo pipefail
          rpmdev-setuptree
          cp "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz" "$HOME/rpmbuild/SOURCES/"
          tar -xzf "source/xfce4-meowmenu-plugin-${VERSION}.tar.gz"
          cp "xfce4-meowmenu-plugin-${VERSION}/dist/rpm/xfce4-meowmenu-plugin.spec" \
            "$HOME/rpmbuild/SPECS/"
          spec="$HOME/rpmbuild/SPECS/xfce4-meowmenu-plugin.spec"
          sed -i "s/^Version:.*/Version:        ${RPM_VERSION}/" "$spec"
          sed -i "s/^%global upstream_version.*/%global upstream_version ${VERSION}/" "$spec"
          if rpm -q --whatprovides 'pkgconfig(exo-2)' >/dev/null 2>&1; then
            echo "::error::Exo development files existed before manifest resolution"
            exit 1
          fi
          dnf -y builddep "$spec"
          testlog="$RUNNER_TEMP/rpm-testlog.txt"
          rpmbuild -ba --define "meowmenu_testlog ${testlog}" "$spec"
          package="$HOME/rpmbuild/RPMS/x86_64/xfce4-meowmenu-plugin-${RPM_VERSION}-1.fc44.x86_64.rpm"
          test -f "$package"
          test -s "$testlog"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}\n' "$package")" = "${RPM_VERSION}-1.fc44"
          if [[ "$RPM_VERSION" == *"~rc"* ]]; then
            stable_rpm="${RPM_VERSION%%~rc*}"
            rpm --eval "%{lua:
              if rpm.vercmp('${RPM_VERSION}', '${stable_rpm}') >= 0 then
                error('release candidate must precede its stable version')
              end
            }"
          fi
          dnf -y install appstream rpmlint
          appstreamcli validate --no-net \
            "xfce4-meowmenu-plugin-${VERSION}/data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml"
          rpmlint "$spec" "$package" | tee rpmlint.log || true
          dnf -y install "$package"
          test "$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' xfce4-meowmenu-plugin)" = \
            "${RPM_VERSION}-1.fc44"
          test "$(rpm -qf --qf '%{NAME}\n' /usr/bin/exo-open)" = exo
          test "$(rpm -qf --qf '%{NAME}\n' /usr/bin/exo-desktop-item-edit)" = exo
          plugin="$(find /usr/lib64 /usr/lib -path '*/xfce4/panel/plugins/libmeowmenu.so' -print -quit)"
          "xfce4-meowmenu-plugin-${VERSION}/build-aux/compat/assert-dependency-regime.sh" \
            --regime legacy --plugin "$plugin" \
            --testlog "$testlog"
          "xfce4-meowmenu-plugin-${VERSION}/build-aux/compat/installed-action-smoke.sh" \
            --regime legacy --plugin "$plugin" > installed-action-smoke.log
          mkdir -p artifacts
          cp "$package" \
            "artifacts/xfce4-meowmenu-plugin-${VERSION}-1.fc44.x86_64.rpm"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: artifacts/*.rpm

      - name: Upload advisory lint output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpmlint-fedora44
          path: rpmlint.log
          if-no-files-found: ignore
          retention-days: 7

  arch-pkgbuild-test:
    name: arch-pkgbuild-test
    needs: validate-tag
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install packaging tools and create builder
        run: |
          pacman -Syu --noconfirm --needed git namcap pacman-contrib sudo
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel

      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          path: candidate

      - name: Prepare, build, test, lint, install, and compare version
        env:
          MEOWMENU_PACKAGE_VERSION: ${{ needs.validate-tag.outputs.version }}
          EXPECTED_ARCH_VERSION: ${{ needs.validate-tag.outputs.arch_version }}
        run: |
          cd candidate
          git config --global --add safe.directory "$PWD"
          build_dir="$(build-aux/arch/prepare-source.sh)"
          mkdir -p "$RUNNER_TEMP/arch-logs"
          package="$(build-aux/arch/build-package.sh "$build_dir" \
            2> >(tee "$RUNNER_TEMP/arch-logs/build.log" >&2))"
          build-aux/arch/run-namcap.sh \
            "$build_dir/PKGBUILD" "$package" "$RUNNER_TEMP/arch-logs"
          build-aux/arch/smoke-install.sh "$package"
          test "$(pacman -Q xfce4-meowmenu-plugin | awk '{print $2}')" = \
            "${EXPECTED_ARCH_VERSION}-1"
          if [[ "$EXPECTED_ARCH_VERSION" == *rc* ]]; then
            stable_arch="${EXPECTED_ARCH_VERSION%%rc*}"
            test "$(vercmp "$EXPECTED_ARCH_VERSION" "$stable_arch")" -lt 0
          fi
          cp "$build_dir/PKGBUILD" "$RUNNER_TEMP/arch-logs/PKGBUILD"
          sudo -u builder bash -c \
            "cd '$build_dir' && makepkg --printsrcinfo" \
            > "$RUNNER_TEMP/arch-logs/.SRCINFO"

      - name: Upload Arch validation metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arch-pkgbuild-logs
          path: ${{ runner.temp }}/arch-logs
          if-no-files-found: error
          retention-days: 30

  assemble-release:
    name: assemble-package-set
    needs: [validate-tag, source, build-deb, build-rpm, arch-pkgbuild-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate

      - name: Run release, presentation, documentation, and translation gates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext appstream
          python3 release-tools/tests/test_release_version.py
          python3 release-tools/tests/test_release_contract.py
          python3 release-tools/tests/test_repository_presentation.py
          python3 release-tools/tests/test_documentation_links.py
          python3 release-tools/tests/test_translation_status.py
          appstreamcli validate --no-net \
            candidate/data/metainfo/io.github.matteobonanomi.xfce4-meowmenu-plugin.metainfo.xml

      - name: Download Ubuntu DEB
        uses: actions/download-artifact@v8
        with:
          name: deb-package-ubuntu
          path: artifacts

      - name: Download Debian DEB
        uses: actions/download-artifact@v8
        with:
          name: deb-package-debian
          path: artifacts

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: artifacts

      - name: Download canonical source
        uses: actions/download-artifact@v8
        with:
          name: canonical-source
          path: artifacts

      - name: Generate and validate notes, manifest, and inventory
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          python3 release-tools/build-aux/release/release_notes.py \
            --news candidate/NEWS --version "$VERSION" --output release-notes.md
          python3 release-tools/build-aux/release/artifacts.py checksums \
            --assets artifacts --version "$VERSION"
          test -f artifacts/SHA256SUMS
          python3 release-tools/build-aux/release/artifacts.py verify \
            --assets artifacts --version "$VERSION"

      - name: Upload complete package set
        uses: actions/upload-artifact@v7
        with:
          name: package-set-${{ needs.validate-tag.outputs.version }}-${{ github.run_id }}
          path: |
            artifacts/*
            release-notes.md
          retention-days: 30

  publish-release:
    name: publish-release
    needs: [validate-tag, assemble-release]
    if: needs.validate-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Download complete package set
        uses: actions/download-artifact@v8
        with:
          name: package-set-${{ needs.validate-tag.outputs.version }}-${{ github.run_id }}
          path: package-set

      - name: Publish one complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/release.json 2>/dev/null; then
            if test "$(jq -r .isDraft /tmp/release.json)" = true; then
              gh release delete "$RELEASE_TAG" --yes
            else
              echo "::error::A public release already exists for ${RELEASE_TAG}"
              exit 1
            fi
          fi
          release_flags=()
          if [[ "$VERSION" =~ -rc[0-9]+$ ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" package-set/artifacts/* \
            --verify-tag \
            --title "MeowMenu ${VERSION}" \
            --notes-file package-set/release-notes.md \
            "${release_flags[@]}"

      - name: Download and verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir downloaded
          gh release download "$RELEASE_TAG" --dir downloaded
          python3 release-tools/build-aux/release/artifacts.py verify \
            --assets downloaded --version "$VERSION"
