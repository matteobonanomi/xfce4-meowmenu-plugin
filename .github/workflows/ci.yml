# =============================================================================
# Job-name contract (DO NOT RENAME without coordinated branch-protection update)
# =============================================================================
# Branch-protection rules on `main` reference the following job `name:`
# strings verbatim. Renaming without updating required-checks will silently
# break merge gating.
#
# Source of truth: .specify/specs/009-ci-foundation/contracts/workflow-jobs.md §2
#
# Required on `main`:
#   build (ubuntu-26.04, debugoptimized)
#   build (ubuntu-26.04, release)
#   build (debian-13, debugoptimized)
#   build (debian-13, release)
#   build (fedora-44, debugoptimized)
#   build (fedora-44, release)
#   sanitizers
#   translations
#   no-optional-deps
#
# Rename protocol (FR-023): if you rename a required job, the same PR MUST
# update branch-protection required-checks. See docs/ci.md "Rename protocol".
# =============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.distro }}, ${{ matrix.buildtype }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04, debian-13, fedora-44]
        buildtype: [debugoptimized, release]
        include:
          - distro: ubuntu-26.04
            image: ubuntu:26.04
          - distro: debian-13
            image: debian:13
          - distro: fedora-44
            image: fedora:44
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        if: matrix.distro == 'ubuntu-26.04'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Install build dependencies (Debian 13)
        if: matrix.distro == 'debian-13'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Install build dependencies (Fedora 44)
        if: matrix.distro == 'fedora-44'
        run: |
          dnf -y install \
              gcc gcc-c++ make meson ninja-build pkgconf-pkg-config \
              gtk3-devel glib2-devel \
              garcon-devel \
              xfce4-panel-devel libxfce4ui-devel libxfce4util-devel \
              exo-devel \
              xfconf-devel \
              accountsservice-devel gtk-layer-shell-devel \
              gettext \
              dbus-daemon xfconf \
              git ca-certificates

      - name: Meson setup
        run: meson setup build --buildtype=${{ matrix.buildtype }}

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: meson test -C build --print-errorlogs

  # HACK: `b_lundef=false` is required because the plugin is built as a
  # `shared_module` (see Edge Cases §269 in spec.md). Without it, the
  # sanitizer link step fails on unresolved symbols that the panel resolves
  # at runtime.
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Meson setup (ASan + UBSan, b_lundef=false for shared_module)
        run: |
          meson setup build \
              --buildtype=debug \
              -Db_sanitize=address,undefined \
              -Db_lundef=false

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: |
          # NOTE: suppressions paths must be absolute — ASan/UBSan resolve
          # relative paths against the test binary's cwd, not the repo root.
          export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1:suppressions=${GITHUB_WORKSPACE}/build-aux/asan_suppressions.txt"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1:suppressions=${GITHUB_WORKSPACE}/build-aux/ubsan_suppressions.txt"
          meson test -C build --print-errorlogs

  translations:
    name: translations
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gettext
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gettext

      - name: msgfmt --check every po/*.po
        run: |
          for f in po/*.po; do
              msgfmt --check --check-format -o /dev/null "$f"
          done

  no-optional-deps:
    name: no-optional-deps
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              gettext \
              git ca-certificates

      - name: Meson setup (optional deps disabled)
        run: |
          meson setup build \
              --buildtype=release \
              -Daccountsservice=disabled \
              -Dgtk-layer-shell=disabled

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: meson test -C build --print-errorlogs

  # Feature 010 — identity-grep gate (FR-006, FR-007, FR-008, FR-015).
  # (1) Confirms no `xfce4-whiskermenu-plugin` references outside the
  #     allow-listed fork-credit surfaces from data-model.md E1.
  # (2) Confirms the legacy `/plugins/whiskermenu` Xfconf base is only
  #     ever referenced from the documented migration code path
  #     (panel-plugin/migration.{cpp,h}, tests/test_migration.cpp).
  identity-grep:
    name: identity-grep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grep for stale xfce4-whiskermenu-plugin references
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -rn 'xfce4-whiskermenu-plugin' \
                    --include='*.cpp' --include='*.h' --include='*.in' \
                    --include='*.build' --include='*.md' --include='*.xml' \
                    --include='*.po' --include='*.pot' --include='*.spec' \
                    --include='control' --include='copyright' \
                    -- . \
                  | grep -v '^\./\.git/' \
                  | grep -v '^\./build/' \
                  || true)"
          # Allow-list per data-model.md E1 §Validation. grep -rn with
          # an explicit search path of `.` emits paths with the `./`
          # prefix; the patterns below match accordingly.
          allowed='^(\./)?debian/copyright:'
          allowed="${allowed}|^(\./)?data/metainfo/xfce4-meowmenu-plugin\.appdata\.xml:"
          allowed="${allowed}|^(\./)?docs/whisker-modernization-spec\.md:"
          # docs/architecture/ holds the bootstrap (§6.1 CLAUDE.md) read-only
          # analysis of the upstream Whisker plugin; it legitimately names the
          # upstream module as historical context, not as a live identifier.
          allowed="${allowed}|^(\./)?docs/architecture/"
          allowed="${allowed}|^(\./)?\.specify/specs/"
          allowed="${allowed}|^(\./)?panel-plugin/core/plugin\.cpp:.*xfce4-whiskermenu-plugin"
          # README and docs/index.md cross-link the upstream Whisker project per
          # FR-017 (acknowledge origin). Limit allow-listing to the badge,
          # the fork-credit sentence, and the 'Whisker Menu source' link.
          allowed="${allowed}|^(\./)?README\.md:.*fork%20of-Whisker"
          allowed="${allowed}|^(\./)?README\.md:.*originated as a fork of"
          allowed="${allowed}|^(\./)?README\.md:.*Whisker Menu source"
          allowed="${allowed}|^(\./)?docs/index\.md:.*\[Whisker Menu\]"
          allowed="${allowed}|^(\./)?po/.*\.po:.*Last-Translator"
          allowed="${allowed}|^(\./)?po/.*\.po:.*Language-Team"
          allowed="${allowed}|^(\./)?po/.*\.po:.*msgstr"
          violations="$(printf '%s\n' "$hits" | grep -v -E "${allowed}" | sed '/^$/d' || true)"
          if [ -n "$violations" ]; then
            echo "::error::FR-015 violation: stale xfce4-whiskermenu-plugin references outside the data-model.md E1 allow-list:"
            printf '%s\n' "$violations"
            exit 1
          fi

      - name: Grep for legacy Xfconf namespace outside migration code
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -rn '/plugins/whiskermenu' \
                    --include='*.cpp' --include='*.h' \
                    -- panel-plugin tests \
                  || true)"
          allowed='^panel-plugin/migration\.(cpp|h):'
          allowed="${allowed}|^tests/test_migration\.cpp:"
          allowed="${allowed}|^tests/test_settings_key_inventory\.cpp:"
          violations="$(printf '%s\n' "$hits" | grep -v -E "${allowed}" | sed '/^$/d' || true)"
          if [ -n "$violations" ]; then
            echo "::error::FR-006/FR-007/FR-008 violation: /plugins/whiskermenu referenced outside migration code"
            printf '%s\n' "$violations"
            exit 1
          fi

  # Feature 010 — docs-dependency-drift advisory (FR-027, SC-013). Diffs
  # the dep lists declared in debian/control + packaging spec against the
  # lists embedded in docs/install-*.md and docs/build-from-source.md.
  # Emits a workflow warning on drift (not a hard fail).
  docs-dependency-drift:
    name: docs-dependency-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare package and docs dep lists
        shell: bash
        run: |
          set -uo pipefail
          control_deps="$(awk '/^Depends:/{p=1;next} /^Recommends:/{p=1;next} /^[A-Za-z-]+:/{p=0} p' debian/control \
                          | tr ',' '\n' \
                          | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*\)//; s/[[:space:]]*$//' \
                          | grep -v '^\${' \
                          | grep -v '^$' \
                          | sort -u || true)"
          spec_requires="$(grep -E '^(Requires|Recommends):' dist/rpm/xfce4-meowmenu-plugin.spec \
                            | awk '{$1=""; print}' \
                            | tr ' ' '\n' \
                            | sed '/^$/d' \
                            | sort -u || true)"
          missing_in_docs=()
          for d in $control_deps $spec_requires; do
            if [ -z "$d" ]; then continue; fi
            if ! grep -RIqF -- "$d" docs/install-*.md docs/build-from-source.md 2>/dev/null; then
              missing_in_docs+=("$d")
            fi
          done
          if [ "${#missing_in_docs[@]}" -gt 0 ]; then
            echo "::warning::docs-dependency-drift: dependencies declared in packaging but not mentioned in docs/install-*.md or docs/build-from-source.md:"
            printf '  - %s\n' "${missing_in_docs[@]}"
          else
            echo "docs dependency lists are consistent with packaging."
          fi

# Action-pinning audit (FR-022, T012/T047):
#   - actions/checkout@v4  (allowed; major pin)
#   No `@main` / `@master` references. See
#   .specify/specs/009-ci-foundation/notes/action-pins.md.
