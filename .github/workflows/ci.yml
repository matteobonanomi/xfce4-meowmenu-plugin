# =============================================================================
# Job-name contract (DO NOT RENAME without coordinated branch-protection update)
# =============================================================================
# Branch-protection rules on `release` reference the following job `name:`
# strings verbatim. Renaming without updating required-checks will silently
# break merge gating.
#
# Source of truth: .specify/specs/009-ci-foundation/contracts/workflow-jobs.md §2
#
# Required on `release`:
#   build (ubuntu-26.04, debugoptimized)
#   build (ubuntu-26.04, release)
#   build (debian-13, debugoptimized)
#   build (debian-13, release)
#   build (fedora-44, debugoptimized)
#   build (fedora-44, release)
#   sanitizers
#   translations
#   no-optional-deps
#
# Rename protocol (FR-023): if you rename a required job, the same PR MUST
# update branch-protection required-checks. See docs/ci.md "Rename protocol".
# =============================================================================

name: ci

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.distro }}, ${{ matrix.buildtype }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04, debian-13, fedora-44]
        buildtype: [debugoptimized, release]
        include:
          - distro: ubuntu-26.04
            image: ubuntu:26.04
          - distro: debian-13
            image: debian:13
          - distro: fedora-44
            image: fedora:44
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        if: matrix.distro == 'ubuntu-26.04'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-0-dev libgarcon-gtk3-1-0-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Install build dependencies (Debian 13)
        if: matrix.distro == 'debian-13'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Install build dependencies (Fedora 44)
        if: matrix.distro == 'fedora-44'
        run: |
          dnf -y install \
              @development-tools meson ninja-build pkgconf-pkg-config \
              gtk3-devel glib2-devel \
              garcon-devel \
              xfce4-panel-devel libxfce4ui-devel libxfce4util-devel \
              xfconf-devel \
              accountsservice-devel gtk-layer-shell-devel \
              gettext \
              git ca-certificates

      - name: Meson setup
        run: meson setup build --buildtype=${{ matrix.buildtype }}

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: meson test -C build --print-errorlogs

  # HACK: `b_lundef=false` is required because the plugin is built as a
  # `shared_module` (see Edge Cases §269 in spec.md). Without it, the
  # sanitizer link step fails on unresolved symbols that the panel resolves
  # at runtime.
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-0-dev libgarcon-gtk3-1-0-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              git ca-certificates

      - name: Meson setup (ASan + UBSan, b_lundef=false for shared_module)
        run: |
          meson setup build \
              --buildtype=debug \
              -Db_sanitize=address,undefined \
              -Db_lundef=false

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:suppressions=tools/asan_suppressions.txt
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=tools/ubsan_suppressions.txt
        run: meson test -C build --print-errorlogs

  translations:
    name: translations
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gettext
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gettext

      - name: msgfmt --check every po/*.po
        run: |
          for f in po/*.po; do
              msgfmt --check --check-format -o /dev/null "$f"
          done

  no-optional-deps:
    name: no-optional-deps
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-0-dev libgarcon-gtk3-1-0-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libxfconf-0-dev \
              gettext \
              git ca-certificates

      - name: Meson setup (optional deps disabled)
        run: |
          meson setup build \
              --buildtype=release \
              -Daccountsservice=disabled \
              -Dgtk-layer-shell=disabled

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: meson test -C build --print-errorlogs

# Action-pinning audit (FR-022, T012/T047):
#   - actions/checkout@v4  (allowed; major pin)
#   No `@main` / `@master` references. See
#   .specify/specs/009-ci-foundation/notes/action-pins.md.
