# =============================================================================
# Job-name contract (DO NOT RENAME without coordinated branch-protection update)
# =============================================================================
# Branch-protection rules on `main` reference the following job `name:`
# strings verbatim. Renaming without updating required-checks will silently
# break merge gating.
#
# Required on `main`:
#   build (ubuntu-26.04, debugoptimized)
#   build (ubuntu-26.04, release)
#   build (debian-13, debugoptimized)
#   build (debian-13, release)
#   build (fedora-44, debugoptimized)
#   build (fedora-44, release)
#   sanitizers
#   translations
#   no-optional-deps
#
# If a required job is renamed, the same change must
# update branch-protection required-checks. See docs/ci.md "Rename protocol".
# =============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.distro }}, ${{ matrix.buildtype }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-26.04, debian-13, fedora-44]
        buildtype: [debugoptimized, release]
        include:
          - distro: ubuntu-26.04
            image: ubuntu:26.04
          - distro: debian-13
            image: debian:13
          - distro: fedora-44
            image: fedora:44
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        if: matrix.distro == 'ubuntu-26.04'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              xvfb xauth \
              git ca-certificates

      - name: Install build dependencies (Debian 13)
        if: matrix.distro == 'debian-13'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              xvfb xauth \
              git ca-certificates

      - name: Install build dependencies (Fedora 44)
        if: matrix.distro == 'fedora-44'
        run: |
          dnf -y install \
              gcc gcc-c++ make meson ninja-build pkgconf-pkg-config \
              gtk3-devel glib2-devel \
              garcon-devel \
              xfce4-panel-devel libxfce4ui-devel libxfce4util-devel \
              exo-devel \
              xfconf-devel \
              accountsservice-devel gtk-layer-shell-devel \
              gettext \
              xorg-x11-server-Xvfb \
              dbus-daemon xfconf \
              git ca-certificates

      - name: Meson setup
        run: meson setup build --buildtype=${{ matrix.buildtype }}

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: xvfb-run -a meson test -C build --print-errorlogs

  # HACK: `b_lundef=false` is required because the plugin is built as a
  # `shared_module` (see Edge Cases §269 in spec.md). Without it, the
  # sanitizer link step fails on unresolved symbols that the panel resolves
  # at runtime.
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              libaccountsservice-dev libgtk-layer-shell-dev \
              gettext \
              xvfb xauth \
              git ca-certificates

      - name: Meson setup (ASan + UBSan, b_lundef=false for shared_module)
        run: |
          meson setup build \
              --buildtype=debug \
              -Db_sanitize=address,undefined \
              -Db_lundef=false

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: |
          # NOTE: suppressions paths must be absolute — ASan/UBSan resolve
          # relative paths against the test binary's cwd, not the repo root.
          export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1:suppressions=${GITHUB_WORKSPACE}/build-aux/asan_suppressions.txt"
          export LSAN_OPTIONS="suppressions=${GITHUB_WORKSPACE}/build-aux/lsan_suppressions.txt"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1:suppressions=${GITHUB_WORKSPACE}/build-aux/ubsan_suppressions.txt"
          # xvfb-run provides a virtual display so the GTK widget-construction
          # tests run here instead of aborting; the sanitizers then exercise the
          # freed-view safeguard path under a real display.
          xvfb-run -a meson test -C build --print-errorlogs

  translations:
    name: translations
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gettext
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gettext

      - name: msgfmt --check every po/*.po
        run: |
          for f in po/*.po; do
              msgfmt --check --check-format -o /dev/null "$f"
          done

  no-optional-deps:
    name: no-optional-deps
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu 26.04)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential meson ninja-build pkg-config \
              libgtk-3-dev libglib2.0-dev \
              libgarcon-1-dev libgarcon-gtk3-1-dev \
              libxfce4panel-2.0-dev libxfce4ui-2-dev libxfce4util-dev \
              libexo-2-dev \
              libxfconf-0-dev \
              gettext \
              xvfb xauth \
              git ca-certificates

      - name: Meson setup (optional deps disabled)
        run: |
          meson setup build \
              --buildtype=debugoptimized \
              -Daccountsservice=disabled \
              -Dgtk-layer-shell=disabled

      - name: Meson compile
        run: meson compile -C build

      - name: Meson test
        run: xvfb-run -a meson test -C build --print-errorlogs

  # Keep package dependency names represented in the maintained installation
  # guide. This check is advisory because package aliases differ by distro.
  docs-dependency-drift:
    name: docs-dependency-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare package and docs dep lists
        shell: bash
        run: |
          set -uo pipefail
          control_deps="$(awk '/^Depends:/{p=1;next} /^Recommends:/{p=1;next} /^[A-Za-z-]+:/{p=0} p' debian/control \
                          | tr ',' '\n' \
                          | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*\)//; s/[[:space:]]*$//' \
                          | grep -v '^\${' \
                          | grep -v '^$' \
                          | sort -u || true)"
          spec_requires="$(grep -E '^(Requires|Recommends):' dist/rpm/xfce4-meowmenu-plugin.spec \
                            | awk '{$1=""; print}' \
                            | tr ' ' '\n' \
                            | sed '/^$/d' \
                            | sort -u || true)"
          missing_in_docs=()
          for d in $control_deps $spec_requires; do
            if [ -z "$d" ]; then continue; fi
            if ! grep -Fq -- "$d" docs/installation.md 2>/dev/null; then
              missing_in_docs+=("$d")
            fi
          done
          if [ "${#missing_in_docs[@]}" -gt 0 ]; then
            echo "::warning::docs-dependency-drift: packaging dependencies missing from docs/installation.md:"
            printf '  - %s\n' "${missing_in_docs[@]}"
          else
            echo "docs dependency lists are consistent with packaging."
          fi

# Actions use stable major-version references; no branch references are used.
